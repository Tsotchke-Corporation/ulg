# ICC completion oracles for ULG.
#
# These targets describe ULG-specific browser, resident WebGPU, material
# closure, reaction, and handoff evidence. ICC executes these targets today.
# Campaign development gates match reviewed receipts, not numeric predicates:
# actual source/artifact review and domain measurements remain mandatory.
# Keep FAIL visible instead of filtering for PASS-only history. Unproven
# required checks must be FAIL with a reason, never WARN/UNKNOWN acceptance.
# Use one explicit current-run trace bundle; see plan/CURRENT-PLAN.md and
# plan/todo/seven-goal-campaign.md.
#
# 2026-11-19 owner updates (plan/CURRENT-PLAN.md):
# - G1 decoupled rule: >=54 Hz presentation of the latest committed physics
#   state (presented_steps == physics_steps is no longer required).
# - Vertical slices lock and turn ON by default once GPU invariants and the
#   hard per-step submit/indirect-dispatch/ms budget gate pass; clean local
#   commits + ICC source-drift replace manual 574-file source-hash manifests.
# 2026-11-22 owner restructuring (plan/CURRENT-PLAN.md — 40-OOM Foundation-First Roadmap):
# - Active campaign consolidated into 6 Scale-Ladder gates (ulg-gate0..ulg-gate5)
#   plus accepted ulg-g5-reservation and ulg-g7-release-audit (2/8 accepted).
# - Deleted bulk-water preset removed from ulg-g1-presentation (5 shipped presets).
# - All 13 historical granular target names and prior failed evidence remain
#   preserved unchanged below for audit lineage.

oracles:
  # =========================================================================
  # Active 40-OOM Scale-Ladder Campaign Gates (2026-11-22 Foundation-First)
  # =========================================================================
  - name: ulg-gate0-foundation-arch
    criteria:
      - &ulg_campaign_receipt
        kind: runtime_event
        severity: high
        event_kinds: [ulg_campaign_receipt]
        event_schemas: [ulg.campaign.receipt.v1]
        event_statuses: [PASS, FAIL]
        event_lanes: [development-review]
        id: gate0-foundation-arch-candidate-review
        label: "Candidate source, peercompute-core bundle audit, gpuMath Vulkan proofs, canonical ABIs and step-loop probes reviewed"
        event_names: [candidate-review]
        event_contract_ids: [ulg.gate0-foundation-arch.v1]
      - <<: *ulg_campaign_receipt
        id: gate0-peercompute-core-and-gpumath
        label: "Slim peercompute-core entrypoint eliminates ort-wasm dist bloat (<45 MB dist); shared gpuMath (eigensolver, 3D FFT, WebGPU MD, polytope Chebyshev) passes native Vulkan invariants with zero hot-loop CPU readbacks"
        event_names: [peercompute-core-and-gpumath]
        event_contract_ids: [ulg.gate0-foundation-arch.v1]
      - <<: *ulg_campaign_receipt
        id: gate0-canonical-abis-and-zero-churn
        label: "ulg.material-property-bundle.v1 and ulg.polytope-atlas.v1 locked; continuum Zero-Churn Step Loop eliminates per-step buffer/bindGroup/workDone churn, deduplicates overlapping contact laws, fixes thermalPotential stall, and retires 63-limb rationals & CPU mirrors"
        event_names: [canonical-abis-and-zero-churn]
        event_contract_ids: [ulg.gate0-foundation-arch.v1]

